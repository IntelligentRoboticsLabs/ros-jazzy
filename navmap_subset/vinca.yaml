ros_distro: jazzy

conda_index:
  - robostack.yaml
  - packages-ignore.yaml

# Keep in sync with the main build_number used by ros-jazzy
build_number: 18

mutex_package:
  name: "ros2-distro-mutex"
  version: "0.15.0"
  upper_bound: "x.x"
  run_constraints:
    - libboost 1.90.*
    - libboost-devel 1.90.*
    - pcl 1.15.1.*
    - gazebo 11.*
    - libprotobuf 6.33.*
    - vtk 9.6.2.*

packages_skip_by_deps:
  - if: not linux
    then:
      - pendulum_control
      - rttest
      - tlsf
      - tlsf_cpp

packages_remove_from_deps:
  - if: not linux
    then:
      - pendulum_control
      - rttest
      - tlsf
      - tlsf_cpp

# Skip packages already built/published upstream; we only want missing bits.
skip_existing:
  - https://repo.prefix.dev/robostack-jazzy/

packages_select_by_deps:
  - navmap_core
  - navmap_ros
  - navmap_ros_interfaces

patch_dir: patch
rosdistro_snapshot: rosdistro_snapshot.yaml
rosdistro_additional_recipes: rosdistro_additional_recipes.yaml
